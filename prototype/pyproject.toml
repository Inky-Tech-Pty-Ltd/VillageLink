[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "villagelink-prototype"
version = "0.0.1"
description = "Disposable first working prototype for Village Link"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7"]

[project.scripts]
villagelink-browser = "villagelink.browser:main"
villagelink-list = "villagelink.db:main"
villagelink-publish = "villagelink.publisher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["villagelink*"]
