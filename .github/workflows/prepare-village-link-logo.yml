name: Prepare transparent Village Link logo (branch only)

on:
  push:
    branches: [puck/transparent-heritage-logo]
    paths:
      - .github/workflows/prepare-village-link-logo.yml

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Inspect original and make transparent candidate plus previews
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageStat
          from pathlib import Path
          from collections import Counter
          import math, statistics

          path = Path('docs/assets/Village Link Heritage Bridge Logo.png')
          im = Image.open(path).convert('RGBA')
          w, h = im.size
          print('HERITAGE_ORIGINAL', (w,h), 'corners', [im.getpixel((x,y)) for x,y in [(0,0),(w-1,0),(0,h-1),(w-1,h-1)]],flush=True)
          corners = [im.getpixel((x,y)) for x,y in [(0,0),(w-1,0),(0,h-1),(w-1,h-1)]]
          bg = tuple(round(statistics.median(v[i] for v in corners)) for i in range(3))
          distances = [math.dist(v[:3], bg) for v in corners]
          print('BACKGROUND_ESTIMATE', bg, 'CORNER_DISTANCES', distances,flush=True)

          def make_thumb(src,size=480):
              pic=src.copy()
              pic.thumbnail((size,size),Image.Resampling.LANCZOS)
              return pic

          original_thumb=make_thumb(im)
          original_thumb.save('docs/assets/.heritage-original-preview.png',optimize=True)

          if max(distances)>24:
              print('CAUTION: corners vary; no transparency conversion performed',flush=True)
          else:
              raw=im.load()
              # Background-to-alpha for the corner colour; original foreground colours stay intact.
              for y in range(h):
                  for x in range(w):
                      r,g,b,a=raw[x,y]
                      d=math.dist((r,g,b),bg)
                      # Antialias feather on near-background pixels. Do not change
                      # non-background colour values.
                      s=max(0,min(1,(d-9)/29))
                      raw[x,y]=(r,g,b,round(a*s))
              output=Path('docs/assets/Village Link Heritage Bridge Logo transparent.png')
              im.save(output,optimize=True,compress_level=9)
              print('TRANSPARENT_CANDIDATE',output, output.stat().st_size,flush=True)
              cand=make_thumb(im)
              cand.save('docs/assets/.heritage-transparent-preview.png',optimize=True)

          other=Image.open('docs/assets/.heritage-original-preview.png').convert('RGBA')
          transparent_file=Path('docs/assets/.heritage-transparent-preview.png')
          if transparent_file.exists():
              after=Image.open(transparent_file).convert('RGBA')
              def check_canvas(src):
                  dst=Image.new('RGB',(480,480),'#d7e1ea')
                  for yy in range(0,480,32):
                      for xx in range(0,480,32):
                          if (xx//32+yy//32)%2==0:
                              ImageDraw.Draw(dst).rectangle((xx,yy,xx+31,yy+31),fill='#fff9ed')
                  dst.paste(src,((480-src.width)//2,(480-src.height)//2),src)
                  return dst
              c=Image.new('RGB',(960,480),'white')
              c.paste(check_canvas(other),(0,0))
              c.paste(check_canvas(after),(480,0))
              c.save('docs/assets/.heritage-background-comparison.png',optimize=True)
          PY
      - name: Commit branch-only result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'docs/assets/Village Link Heritage Bridge Logo transparent.png' docs/assets/.heritage-*.png
          if ! git diff --cached --quiet; then
            git commit -m 'Prepare Village Link Heritage Bridge transparency candidate'
            git push
          fi
