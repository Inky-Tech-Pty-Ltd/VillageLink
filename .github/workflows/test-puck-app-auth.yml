name: Test Puck-GPT App authentication

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  test-puck-auth:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 10 &&
       github.event.comment.body == '/puck-auth-test')
    runs-on: ubuntu-latest
    steps:
      - name: Create Puck-GPT installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: '4708095'
          private-key: ${{ secrets.PUCK_GPT_PRIVATE_KEY }}
          owner: Inky-Tech-Pty-Ltd
          repositories: VillageLink

      - name: Comment on attribution test issue as Puck-GPT
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh issue comment 10 \
            --repo Inky-Tech-Pty-Ltd/VillageLink \
            --body "Trigger test successful: Puck-in-ChatGPT caused this GitHub Action, which authenticated as the Puck-GPT App and posted this comment."
