name: VillageLink prototype tests

on:
  pull_request:
    paths:
      - "prototype/**"
      - ".github/workflows/prototype-tests.yml"
  push:
    branches: [main]
    paths:
      - "prototype/**"
      - ".github/workflows/prototype-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run standard-library prototype regression suite
        env:
          PYTHONPATH: prototype
        run: python -m unittest discover -s prototype/tests -v
